<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0d0c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Stamina & Strength Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first app shell (480px column) with bottom tab bar; full-screen guided player overlay for runs and lifts. Deliberately dark-only. */
:root{
  /* Calm warm-dark surfaces, one saffron accent from Hanuman's dhoti; colour lives only in the hero stages. */
  --bg:#0f0d0c; --s1:#1a1715; --s2:#24201d; --s3:#342e2a; --tx:#f7f2ec; --mu:#aaa098; --dim:#766d65;
  --acc:#ff8f3a; --ok:#58c98f; --lift:#f2b84b; --run:#ff8f3a; --walk:#69c2ad; --ink:#140f0c;
  --g-lift:radial-gradient(130% 100% at 75% 12%,#f5b25e 0%,#c9611f 50%,#4a1a0a 100%);
  --g-run:radial-gradient(130% 100% at 75% 12%,#ffb36b 0%,#e9672b 50%,#5c1d0c 100%);
  --g-walk:radial-gradient(130% 100% at 75% 12%,#a3d8c6 0%,#3e8f7d 52%,#143631 100%);
  --g-fast:radial-gradient(130% 100% at 75% 12%,#ff9e6e 0%,#cf3a3c 52%,#470d18 100%);
  --g-rest:radial-gradient(130% 100% at 75% 12%,#6a5546 0%,#2e2621 55%,#171311 100%);
  --g-food:radial-gradient(130% 100% at 75% 12%,#a6d18f 0%,#3f7a4c 52%,#132d1c 100%);
  --disp:"Sora","Segoe UI",Arial,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px calc(104px + env(safe-area-inset-bottom,0px));display:grid;gap:28px}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:28px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.mu{color:var(--mu)} .small{font-size:13px}
.lbl{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .badge{white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;background:var(--s1);border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px}
.top .badge i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.sec{display:grid;gap:12px}
.sech{display:flex;justify-content:space-between;align-items:baseline}
.link{background:none;border:0;color:var(--mu);font-weight:600;font-size:13px;padding:0}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{background:var(--s1);border-radius:14px;padding:8px 0 10px;display:grid;justify-items:center;gap:4px;border:1.5px solid transparent}
.dchip.today{border-color:#fff}
.dchip b{font-family:var(--disp);font-size:17px}
.dchip span{font-size:11px;color:var(--mu);font-weight:600}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.dot.lift{background:rgba(242,184,75,.18)} .dot.run{background:rgba(255,143,58,.18)} .dot.rest{background:var(--s2)}
.dot.lift::after,.dot.run::after{content:"";width:6px;height:6px;border-radius:50%}
.dot.lift::after{background:var(--lift)} .dot.run::after{background:var(--run)}
.dot.done{background:var(--ok)} .dot.done::after{content:"";width:8px;height:4px;border:2px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);border-radius:0;background:none}

/* Hanuman cover */
.cover{position:relative;border-radius:var(--r);overflow:hidden;height:250px;background:#3a0e06}
.cover .hp{display:block;width:100%;height:100%}
.cover .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;background:linear-gradient(transparent,rgba(30,6,2,.85));color:#fff;display:grid;gap:4px}
.cover .cap b{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.05}
.cover .cap span{font-size:13px;font-weight:600;opacity:.9}
/* hero */
.hero{position:relative;border-radius:var(--r);overflow:hidden;background:var(--g);min-height:330px;display:grid;padding:22px;color:#fff;isolation:isolate}
.hero::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.35));z-index:-1}
.hero .f{position:absolute;right:0;top:0;width:64%;max-width:100%;z-index:-1}
.hero .txt{align-self:end;display:grid;gap:8px}
.hero h1{font-size:28px}
.hero .meta{font-weight:600;opacity:.92;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(20,10,5,.28);border-radius:99px;padding:6px 11px;font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;justify-self:start;color:#fff}
.chip.ok{background:var(--ok);color:var(--ink)}
.go{background:var(--tx);color:var(--ink);border:0;border-radius:99px;padding:14px 22px;font-family:var(--disp);font-weight:600;font-size:15px;display:inline-flex;gap:10px;align-items:center;justify-self:start;margin-top:6px}
.go svg{width:14px;height:14px}
.alt{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.ghost{background:rgba(20,10,5,.28);border:0;color:#fff;border-radius:99px;padding:10px 16px;font-weight:700;font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--s1);border-radius:18px;padding:14px 14px 13px;display:grid;gap:8px}
.stat b{font-family:var(--disp);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.stat b small{font-size:14px;color:var(--mu);font-weight:700}

/* program cards */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(72%,260px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pcard{scroll-snap-align:start;border:0;text-align:left;border-radius:var(--r);background:var(--g);color:#fff;padding:14px;min-height:190px;display:grid;align-content:end;gap:4px;position:relative;overflow:hidden;isolation:isolate}
.pcard .f{position:absolute;top:-2%;right:-6%;width:72%;z-index:-1}
.pcard h3{font-size:17px}
.pcard span{font-size:12.5px;font-weight:600;opacity:.9}

/* lists */
.card{background:var(--s1);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.thumb{width:64px;height:54px;border-radius:14px;background:var(--g);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:100%;height:100%}
.row h3{font-size:15.5px}
.row p{font-size:13px;color:var(--mu)}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--tx);color:var(--ink);display:grid;place-items:center}
.play svg{width:13px;height:13px;margin-left:2px}
.pips{display:flex;gap:4px;margin-top:4px}
.pips i{width:16px;height:5px;border-radius:3px;background:var(--s3)}
.pips i.on{background:var(--ok)}
.bighead{border-radius:var(--r);background:var(--g);padding:18px;color:#fff;display:grid;gap:6px;position:relative;overflow:hidden;isolation:isolate;min-height:150px;align-content:end}
.bighead .f{position:absolute;right:-4%;top:-6%;width:56%;z-index:-1}
.bighead .go{padding:11px 18px;font-size:14px}
.divider{height:1px;background:var(--s2)}

/* progress */
.ringwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{width:120px;height:120px}
.ladder{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:4px 0}
.lrow .lt{display:grid;gap:2px;min-width:0}
.lrow .disp{font-size:15px}
.tick{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--s3);background:none;display:grid;place-items:center;font-weight:700;color:var(--dim)}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.ticks{display:flex;gap:6px}
.hist{display:grid;gap:2px}
.hist .row{grid-template-columns:auto minmax(0,1fr) auto;padding:8px 0}
.hdot{width:36px;height:36px;border-radius:12px;background:var(--g)}
.reset{background:var(--s2);border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:13px;color:var(--mu);justify-self:start}

/* food */
.calc{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.calc input,.num{width:96px;padding:10px 12px;border:1.5px solid var(--s3);border-radius:12px;background:var(--s2);color:var(--tx);font:600 16px var(--body)}
.calc output{font-family:var(--disp);font-weight:700;font-size:34px;color:var(--ok)}
.plate{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
.legend{display:grid;gap:8px;font-size:14px}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--mu)}
ul.clean b{color:var(--tx)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,13,12,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--s2);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;color:var(--dim);display:grid;justify-items:center;gap:5px;padding:9px 0 10px;font-weight:600;font-size:11px}
.tabs button span.ti{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background .2s}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--tx)}
.tabs button[aria-current="page"] svg{color:var(--acc)}
.tabs button[aria-current="page"] span.ti{background:rgba(255,143,58,.14)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pl{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 20px;display:grid;gap:14px;align-content:start}
.pbar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;text-align:center}
.ic{width:44px;height:44px;border-radius:50%;border:0;background:var(--s1);display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.ic.armed{background:var(--acc);color:var(--ink)}
.pt b{display:block;font-family:var(--disp);font-size:16px}
.segs{display:flex;gap:3px;height:6px}
.segs i{position:relative;height:100%;border-radius:3px;background:var(--s3);overflow:hidden;display:block}
.segs i::after{content:"";position:absolute;inset:0;width:calc(var(--p,0)*100%);background:var(--c,#fff)}
.stage{position:relative;border-radius:var(--r);background:var(--g);color:#fff;overflow:hidden;isolation:isolate;display:grid;min-height:min(52vh,420px);padding:18px;transition:background .4s}
.stage .f{position:absolute;inset:4% 4% 20% 4%;width:92%;height:76%;z-index:-1}
.stage .phase{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.stage .clock{align-self:end;display:flex;justify-content:space-between;align-items:end;gap:8px}
.stage .clock b{font-family:var(--disp);font-weight:600;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.stage .clock span{font-weight:700;opacity:.9;font-size:14px;text-align:right}
.sbar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(0,0,0,.25)}
.sbar i{display:block;height:100%;background:#fff;width:0}
.next{display:flex;justify-content:space-between;align-items:center;background:var(--s1);border-radius:18px;padding:14px 16px;gap:12px}
.next b{font-family:var(--disp);font-size:17px}
.ctrls{display:flex;justify-content:center;align-items:center;gap:22px;padding-top:4px}
.bigbtn{width:76px;height:76px;border-radius:50%;border:0;background:var(--acc);color:var(--ink);display:grid;place-items:center}
.bigbtn svg{width:26px;height:26px}
.cta{width:100%;border:0;border-radius:18px;background:var(--acc);color:var(--ink);padding:18px;font-family:var(--disp);font-weight:700;font-size:18px}
.cta.alt2{background:var(--s1);color:var(--tx)}
.exhead{display:grid;gap:6px}
.exhead h1{font-size:28px}
.setpills{display:flex;gap:6px}
.setpills i{font-style:normal;font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px;background:var(--s1);color:var(--dim)}
.setpills i.cur{background:var(--tx);color:var(--ink)} .setpills i.dn{background:var(--ok);color:var(--ink)}
.target{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--s1);border-radius:18px;padding:12px 14px}
.target b{white-space:nowrap;font-family:var(--disp);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:12px;border:0;background:var(--s3);font-weight:700;font-size:18px}
.step output{min-width:78px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cue{font-size:14px;color:var(--mu)}
.restring{display:grid;place-items:center;position:relative;margin-top:10px}
.restring svg{width:min(72vw,280px);height:auto}
.restring .in{position:absolute;display:grid;justify-items:center;gap:2px}
.restring b{font-family:var(--disp);font-weight:700;font-size:64px;font-variant-numeric:tabular-nums;line-height:1}
.pillrow{display:flex;gap:10px;justify-content:center}
.pill{border:0;background:var(--s1);border-radius:99px;padding:12px 20px;font-weight:700}
.sum{display:grid;gap:16px;text-align:center;justify-items:center;padding-top:30px}
.sum .burst{width:120px;height:120px;border-radius:50%;background:var(--g);display:grid;place-items:center}
.sum .burst svg{width:52px;height:52px}
.sum h1{font-size:32px}
.sumstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.fig line{stroke-linecap:round}
.mrow{display:grid;grid-template-columns:48px minmax(0,1fr) 44px 84px;gap:10px;align-items:center;background:var(--s1);border-radius:18px;padding:10px 12px}
.mbtn{width:48px;height:48px;border-radius:14px;border:0;background:var(--s3);color:var(--tx);display:grid;place-items:center}
.mbtn.on{background:var(--acc);color:var(--ink)}
.mbtn svg{width:20px;height:20px}
.mi{min-width:0}
.mi b{display:block;font-family:var(--disp);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow input[type=range]{width:100%;accent-color:var(--acc)}
.eq{display:flex;gap:3px;align-items:end;height:18px}
.eq i{width:4px;background:#fff;border-radius:2px;height:40%;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.55s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{to{height:100%}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:70%}}
@media (prefers-reduced-motion:reduce){.stage{transition:none}}
</style>

</head>
<body>
<div class="app" id="view"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<linearGradient id="hSk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9965a"/><stop offset=".5" stop-color="#a8622e"/><stop offset="1" stop-color="#5e3016"/></linearGradient>
<linearGradient id="hSkF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a86a3a"/><stop offset=".55" stop-color="#7e461f"/><stop offset="1" stop-color="#4a250f"/></linearGradient>
<linearGradient id="hGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#f0b93a"/><stop offset="1" stop-color="#a8700f"/></linearGradient>
<linearGradient id="hDhoti" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbc5c"/><stop offset=".5" stop-color="#ec7a1e"/><stop offset="1" stop-color="#b8500f"/></linearGradient>
<linearGradient id="hDhotiF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d08a35"/><stop offset="1" stop-color="#9a420c"/></linearGradient>
<linearGradient id="hSash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec5634"/><stop offset="1" stop-color="#9a1c12"/></linearGradient>
<linearGradient id="hHair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3e1c"/><stop offset="1" stop-color="#2c160a"/></linearGradient>
<radialGradient id="hAura"><stop offset="0" stop-color="#ffe29a" stop-opacity=".6"/><stop offset=".6" stop-color="#ffbe5a" stop-opacity=".18"/><stop offset="1" stop-color="#ffaa3c" stop-opacity="0"/></radialGradient>
</defs></svg>


<nav class="tabs" aria-label="Main">
  <div class="in">
    <button data-act="tab" data-a="today" aria-current="page"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></span>Today</button>
    <button data-act="tab" data-a="plans"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h2M20 12h2M6 7v10M18 7v10M4 9v6M20 9v6M6 12h12"/></svg></span>Workouts</button>
    <button data-act="tab" data-a="progress"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V12M10 20V6M16 20v-9M22 20H2"/></svg></span>Progress</button>
    <button data-act="tab" data-a="food"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18a9 9 0 0 1-18 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"/></svg></span>Food</button>
  </div>
</nav>

<div class="player" id="player" hidden></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var KEY="ssplan-app-v2";
var S={runs:[0,0,0,0,0,0,0,0],speed:0,log:[],kg:{},next:"A",bw:65,voice:true,music:true,style:"dhol",mvol:.55};
try{var saved=JSON.parse(localStorage.getItem(KEY));if(saved)S=Object.assign(S,saved);else{var old=JSON.parse(localStorage.getItem("ssplan-v1")||"null");if(old){for(var i=0;i<8;i++)for(var r=1;r<=3;r++)if(old["r"+i+"_"+r])S.runs[i]++;Object.keys(old).forEach(function(k){if(k.indexOf("kg_")==0&&old[k])S.kg[k.slice(3)]=parseFloat(old[k])||0});if(old.bw)S.bw=old.bw}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function iso(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

/* ---------- icons ---------- */
var IC={

    say(s.label+", "+dur(s.sec));
  }
  var wl=Math.ceil(left);if(wl<=3&&wl>=1&&R.warn!==wl&&R.run){R.warn=wl;beep(440,1)}
  $("#clock").textContent=fmt(left);$("#sbar").style.width=(into/s.sec*100)+"%";$("#left").textContent=fmt(R.total-R.el);
  var segEls=$("#segs").children;for(var k=0;k<segEls.length;k++)segEls[k].style.setProperty("--p",k<i?1:k==i?into/s.sec:0);
}
function finishRun(full){
  clearInterval(timer);timer=null;var r=R;R=null;mode="sum";mStop();
  if(r.w<8){if(S.runs[r.w]<3)S.runs[r.w]++}else S.speed++;
  var mins=Math.round(r.el/60),jog=0,acc=0;r.segs.forEach(function(s){var d=Math.max(0,Math.min(s.sec,r.el-acc));if(s.k!="walk")jog+=d;acc+=s.sec});
  S.log.push({d:iso(),t:"run",w:r.w,r:r.r,min:mins});save();
  var big=r.w==7&&r.r==2&&full;
  beep(990,3);say(big?"You just ran 10 minutes non stop. Amazing work!":"Run complete. Great job.");
  P.innerHTML='<div class="pl"><div class="sum"><div class="burst" style="--g:var(--g-run)">'+IC.check+'</div><span class="lbl">'+runTitle(r.w)+' · Run '+(r.r+1)+'</span><h1>'+(big?"10 minutes non-stop!":"Run complete")+'</h1><p class="mu">'+(big?"You hit your goal. The Speed builder is next.":full?"Nice work. Next run, same time, same effort.":"Saved as done. Finishing early is fine. Repeat this run if it felt too hard.")+'</p>'+
   '<div class="sumstats"><div class="stat"><span class="lbl">Time</span><b>'+fmt(r.el)+'</b></div><div class="stat"><span class="lbl">Jogging</span><b>'+fmt(jog)+'</b></div><div class="stat"><span class="lbl">Week</span><b>'+(r.w<8?Math.min(S.runs[r.w],3)+"<small>/3</small>":"–")+'</b></div></div>'+
   '<button class="cta" data-act="close">Done</button></div></div>';
}

/* ---------- lift player ---------- */
var X=null;
function startLift(L){X={L:L,list:WO[L],i:0,s:0,mode:"work",t0:Date.now(),sets:0,vol:0};mode="lift";openPlayer();drawLift();timer=setInterval(ltick,200)}
function exSegs(){return X.list.map(function(e,i){return '<i style="flex:1;--c:#fff;--p:'+(i<X.i?1:i==X.i?X.s/3:0)+'"></i>'}).join("")}
function stepper(e){var v=S.kg[e.k]||0;return '<div class="step"><button data-act="kg" data-a="-2.5" aria-label="Less weight">−</button><output id="kgv">'+(v?v+" kg":"Body wt")+'</output><button data-act="kg" data-a="2.5" aria-label="More weight">+</button></div>'}
function drawLift(){
  var e=X.list[X.i],m=MV[e.k];
  var head=topbar("Full Body "+X.L,"Exercise "+(X.i+1)+" of "+X.list.length)+'<div class="segs">'+exSegs()+'</div>';
  if(X.mode=="work"||X.mode=="hold"){
    var pills="";for(var i=0;i<3;i++)pills+='<i class="'+(i<X.s?"dn":i==X.s?"cur":"")+'">Set '+(i+1)+'</i>';
    var holding=X.mode=="hold";
    P.innerHTML='<div class="pl">'+head+'<div class="stage" style="--g:var(--g-lift);min-height:min(40vh,330px)">'+fig(e.k,"f",e.hold?3000:2600)+(holding?'<div class="clock"><b id="hold">'+fmt(X.holdLeft||holdSec())+'</b><span>Hold</span></div>':'')+'</div>'+
     '<div class="exhead"><h1>'+m.n+'</h1><div class="setpills">'+pills+'</div></div>'+
     '<div class="target"><div><span class="lbl">Target</span><br><b>'+target(e)+'</b></div>'+(e.w?stepper(e):"")+'</div>'+
     '<p class="cue">'+e.cue+'</p>'+mrow()+
     (e.hold?(holding?'<button class="cta alt2" data-act="holdstop">Stop early</button>':'<button class="cta" data-act="holdgo">Start '+holdSec()+' s hold</button>'):'<button class="cta" data-act="setdone">Set done</button>')+
     '<button class="link" style="justify-self:center" data-act="skipex">Skip this exercise</button></div>';
  }else if(X.mode=="rest"){
    var n=X.list[X.i],C=2*Math.PI*120;
    P.innerHTML='<div class="pl">'+head+'<div class="restring"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="120" fill="none" stroke="var(--s2)" stroke-width="14"/><circle id="rring" cx="130" cy="130" r="120" fill="none" stroke="var(--lift)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="0" transform="rotate(-90 130 130)"/></svg><div class="in"><span class="lbl">Rest</span><b id="rest">'+fmt(X.restLen)+'</b></div></div>'+
     '<div class="pillrow"><button class="pill" data-act="plus15">+15 s</button><button class="pill" data-act="skiprest">Skip rest</button></div>'+
     '<div class="next"><div style="display:flex;gap:12px;align-items:center"><div class="thumb" style="--g:var(--g-lift)">'+fig(n.k,"t")+'</div><div><span class="lbl">Up next · Set '+(X.s+1)+' of 3</span><br><b>'+MV[n.k].n+'</b></div></div><b>'+target(n)+'</b></div>'+
     mrow()+'<p class="small mu" style="text-align:center">Breathe, sip water, get your weight ready.</p></div>';
  }
}
function setDone(){
  var e=X.list[X.i];X.sets++;if(e.w)X.vol+=(S.kg[e.k]||0)*e.reps;
  if(X.s<2){X.s++;rest(75)}else if(X.i<X.list.length-1){X.i++;X.s=0;rest(90)}else finishLift();
}
function rest(sec){mEnergy(false);X.mode="rest";X.restLen=sec;X.restEnd=Date.now()+sec*1000;X.warn=null;drawLift();say("Rest "+sec+" seconds")}
function work(){mEnergy(true);X.mode="work";drawLift();beep(990,2);var e=X.list[X.i];say("Go. "+MV[e.k].n+", set "+(X.s+1)+". "+(e.hold?holdSec()+" second hold":e.reps+" reps"+(e.each?" "+e.each:"")))}
function ltick(){
  if(!X)return;var now=Date.now();
  if(X.mode=="rest"){var left=(X.restEnd-now)/1000,el=$("#rest"),rr=$("#rring");if(!el)return;
    el.textContent=fmt(left);var C=2*Math.PI*120;rr.setAttribute("stroke-dashoffset",(C*(1-Math.max(0,left)/X.restLen)).toFixed(1));
    var wl=Math.ceil(left);if(wl<=3&&wl>=1&&X.warn!==wl){X.warn=wl;beep(440,1)}
    if(left<=0)work();
  }else if(X.mode=="hold"){X.holdLeft=(X.holdEnd-now)/1000;var h=$("#hold");if(h)h.textContent=fmt(X.holdLeft);
    var hl=Math.ceil(X.holdLeft);if(hl<=3&&hl>=1&&X.warn!==hl){X.warn=hl;beep(440,1)}
    if(X.holdLeft<=0){X.holdLeft=null;beep(990,2);setDone()}}
}
function finishLift(){
  clearInterval(timer);timer=null;var x=X;X=null;mode="sum";mStop();
  var mins=Math.max(1,Math.round((Date.now()-x.t0)/60000));
  S.log.push({d:iso(),t:x.L,min:mins});S.next=x.L=="A"?"B":"A";save();
  beep(990,3);say("Workout complete. Strong work.");
  P.innerHTML='<div class="pl"><div class="sum"><div class="burst" style="--g:var(--g-lift)">'+IC.check+'</div><span class="lbl">Full Body '+x.L+'</span><h1>Workout complete</h1><p class="mu">Next time: Full Body '+S.next+'. If every set felt solid today, add a little weight next time.</p>'+
   '<div class="sumstats"><div class="stat"><span class="lbl">Time</span><b>'+mins+'<small> min</small></b></div><div class="stat"><span class="lbl">Sets</span><b>'+x.sets+'<small>/'+x.list.length*3+'</small></b></div><div class="stat"><span class="lbl">Lifted</span><b>'+Math.round(x.vol)+'<small> kg</small></b></div></div>'+
   '<button class="cta" data-act="close">Done</button></div></div>';
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,x=b.dataset.a,y=b.dataset.b;
  switch(a){
    case "tab":tab=x;render();window.scrollTo(0,0);break;
    case "run":startRun(+x,+y);break;
    case "lift":startLift(x);break;
    case "tick":var w=+x,i=+y;S.runs[w]=S.runs[w]>i?i:i+1;save();render();break;
    case "reset":if(armEnd(b)){S={runs:[0,0,0,0,0,0,0,0],speed:0,log:[],kg:{},next:"A",bw:65,voice:S.voice};save();armed=null;render()}else b.textContent="Tap again to clear everything";break;
    case "voice":S.voice=!S.voice;save();b.innerHTML=S.voice?IC.vol:IC.mute;if(!S.voice)try{speechSynthesis.cancel()}catch(e){}break;
    case "end":if(mode=="sum"){closePlayer();break}
      if(armEnd(b)){armed=null;R=null;X=null;closePlayer()}
      else{ // first tap: pause everything so nothing keeps playing while deciding
        mStop();refreshM();try{speechSynthesis.cancel()}catch(e){}
        if(R&&R.run){R.run=false;R.last=Date.now();var ppb=$("#pp");if(ppb){ppb.innerHTML=IC.play;ppb.setAttribute("aria-label","Resume")}var rf=$("#rfig");if(rf)rf.dataset.paused="1"}
        var tip=document.createElement("p");tip.className="small";tip.style.cssText="text-align:center;color:var(--acc);font-weight:700";tip.textContent="Paused. Tap × again to exit.";var pl=P.querySelector(".pl");if(pl&&!pl.querySelector(".exit-tip")){tip.classList.add("exit-tip");pl.insertBefore(tip,pl.children[1]);setTimeout(function(){tip.remove()},3000)}}
      break;
    case "close":closePlayer();break;
    case "rpause":R.run=!R.run;R.last=Date.now();b.innerHTML=R.run?IC.pause:IC.play;b.setAttribute("aria-label",R.run?"Pause":"Resume");$("#rfig").dataset.paused=R.run?"0":"1";if(R.run)mStart();else mStop();refreshM();say(R.run?"Resumed":"Paused");break;
    case "mtoggle":if(M.playing){mStop();S.music=false}else{S.music=true;mStart()}save();refreshM();break;
    case "mstyle":S.style=STY[(STY.indexOf(S.style)+1)%STY.length];save();M.step=0;M.bar=0;try{M.next=ctx.currentTime+.05}catch(e){}refreshM();break;
    case "rskip":var acc=0;for(var k=0;k<=R.cur;k++)acc+=R.segs[k].sec;R.el=Math.min(acc,R.total-0.01);rtick();break;
    case "rfinish":if(armEnd(b)){armed=null;finishRun(false)}break;
    case "setdone":setDone();break;
    case "holdgo":X.mode="hold";X.holdEnd=Date.now()+holdSec()*1000;X.warn=null;drawLift();beep(990,1);say("Hold");break;
    case "holdstop":X.holdLeft=null;setDone();break;
    case "skipex":if(X.i<X.list.length-1){X.i++;X.s=0;X.mode="work";drawLift();work()}else finishLift();break;
    case "plus15":X.restEnd+=15000;X.restLen+=15;break;
    case "skiprest":work();break;
    case "kg":var e=X.list[X.i],v=Math.max(0,(S.kg[e.k]||0)+parseFloat(x));S.kg[e.k]=v;save();$("#kgv").textContent=v?v+" kg":"Body wt";break;
  }
});
document.addEventListener("input",function(ev){if(ev.target.id=="mvol"){S.mvol=parseFloat(ev.target.value);save();try{M.vol&&M.vol.gain.setTargetAtTime(S.mvol,ctx.currentTime,.05)}catch(e){}return}if(ev.target.id=="bw"){var v=parseFloat(ev.target.value);S.bw=v>0?v:S.bw;save();$("#prot").textContent=(v>0?Math.round(v*1.6):"–")+" g"}});
document.addEventListener("visibilitychange",function(){if(document.visibilityState=="visible"&&!P.hidden&&!wake){try{navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){})}catch(e){}}});
render();
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
